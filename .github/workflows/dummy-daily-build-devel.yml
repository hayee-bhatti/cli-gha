name: Dummy Daily Build Test

on:
  workflow_dispatch:  # Manual trigger
  # schedule:
  #   - cron: '0 23 * * *'   # Daily at 7PM EST

jobs:
  build-test:
    runs-on: [self-hosted, amd8]

    steps:
      # Set runner name from GitHub's built-in env var
      - name: Set runner name
        run: echo "RUNNER_NAME=${{ runner.name }}" >> $GITHUB_ENV

      - name: Confirm environment and runner context
        run: |
          source /home/rocky/.bashrc
          echo "OS details:"
          cat /etc/os-release
          echo "Architecture:"
          arch
          echo "Runner name from env: $RUNNER_NAME"

      - name: Simulate build step and generate dummy log
        run: |
          source /home/rocky/.bashrc

          TIMESTAMP=$(date +%d%m%y-%H%M)
          LOGFILE="/tmp/build_to_devel-${RUNNER_NAME}-${TIMESTAMP}.log"

          echo "LOGFILE_PATH=$LOGFILE" >> $GITHUB_ENV
          
          echo "Creating dummy build log at $LOGFILE"
          echo "Dummy build completed successfully on runner $RUNNER_NAME at $TIMESTAMP" > "$LOGFILE"

          EXIT_CODE=0
          echo "Simulated exit code: $EXIT_CODE"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Build failed. Exiting with status $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Upload dummy log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dummy-build-log
          path: ${{ env.LOGFILE_PATH }}
          if-no-files-found: warn
