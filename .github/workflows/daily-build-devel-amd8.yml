name: Daily Build Test

on:
  workflow_dispatch:  # Manual trigger
  # schedule:
  #   - cron: '0 23 * * *'   # Scheduled daily at 7PM EST (currently commented)

jobs:
  build-test:
    runs-on: [self-hosted, amd8]  # Uses the amd8 self-hosted runner

    steps:
      # --- Set runner name and logfile path in environment ---
      - name: Set runner name and logfile path
        run: |
          RUNNER_NAME="${{ runner.name }}"
          TIMESTAMP=$(date +%d%m%y-%H%M)
          LOGFILE_PATH="/tmp/build_to_devel-${RUNNER_NAME}-${TIMESTAMP}.log"

          echo "RUNNER_NAME=$RUNNER_NAME" >> $GITHUB_ENV
          echo "LOGFILE_PATH=$LOGFILE_PATH" >> $GITHUB_ENV

          echo "Runner name set as: $RUNNER_NAME"
          echo "Logfile path set as: $LOGFILE_PATH"

      # --- Confirm environment and show git repo status ---
      - name: Confirm environment and prep for build
        run: |
          source /home/rocky/.bashrc
          echo "OS details:"
          cat /etc/os-release
          echo "Architecture:"
          arch
          echo "Listing project git status:"
          cd $PGE
          git branch
          git status

      # --- Run the actual build script and log the output ---
      - name: Generate platform build and push to devel repo
        run: |
          source /home/rocky/.bashrc

          echo "Starting build. Output will be logged to: $LOGFILE_PATH"

          cd $DEV
          AWS_PROFILE=pgedge-build ./build_to_tempdvl.sh > "$LOGFILE_PATH" 2>&1
          EXIT_CODE=$?

          echo "Build finished with exit code: $EXIT_CODE"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Build failed. Exiting with status $EXIT_CODE"
            exit $EXIT_CODE
          fi

      # --- Upload log file as artifact ---
      - name: Upload build log artifact
        if: always()  # Run even if build failed
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.LOGFILE_PATH }}
          if-no-files-found: warn
